<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Simon HTML</title>
    <link rel="icon" href="favicon.ico" />
    <link rel="stylesheet" href="login.css" />
  </head>

  <body>

    <main>
      <h1 style="color:#fff; font-size:2.5rem; font-family:'Segoe UI','Arial Rounded MT Bold',Arial,sans-serif; text-align:center; margin-bottom:1rem; text-shadow:1px 2px 8px rgba(25,118,210,0.10),0 1px 0 #fff;">ToDo List</h1>
  <p style="color:#fff; text-align:center; margin-top:0.5rem;">To log in, enter <strong>admin</strong> as the username and <strong>password123</strong> as the password.</p>
      <form id="loginForm">
        <div>
          <span>@</span>
          <input type="text" name="username" placeholder="your@email.com" />
        </div>
        <div>
          <span>🔒</span>
          <input type="password" name="password" placeholder="password" />
        </div>
        <button type="submit">Login</button>
        <button type="submit">Create</button>
      </form>
      <div id="errorMsg" style="color:red;"></div>
    </main>

    <footer>
      <hr />
   <p style="color:#fff; text-align:center; margin-top:0.5rem;"><strong>Liz Henshaw</strong></p>
      <br />
      <a href="https://github.com/LizHenshaw100/ToDo-Startup">ToDo-Startup GitHub</a>
    </footer>
